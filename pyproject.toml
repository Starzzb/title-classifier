[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "title-classifier"
version = "8.1.0"
description = "视频标题分类和重命名工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Starzzb"}
]
keywords = ["video", "classification", "rename", "nlp", "vision", "yolo", "clip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "open-clip-torch>=2.20.0",
    "torch>=2.0.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.0.0",
    "tomli-w>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "silero-vad>=5.1.0",
    "openvino>=2024.0.0",
    "ttkbootstrap>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
model-download = [
    "huggingface_hub>=0.20.0",
]

[project.scripts]
title-classifier = "title_classifier.__main__:main"

[project.gui-scripts]
title-classifier-gui = "title_classifier.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.urls]
Homepage = "https://github.com/Starzzb/title-classifier"
Repository = "https://github.com/Starzzb/title-classifier.git"

# PyTorch CUDA 构建（Windows）：显式索引，仅 torch 系列走 cu130，
# 其余依赖仍走 PyPI。CUDA wheel 自带 CUDA 运行库，无需额外 nvidia-* 包。
# 驱动要求：NVIDIA 驱动 >= 580.x（支持 CUDA 13.x）。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
